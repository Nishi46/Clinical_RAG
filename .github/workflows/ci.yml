name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector-enabled image, not plain postgres -- Sprint 3's retrieval
        # ladder needs the vector extension, and setting this up once now
        # avoids revisiting the CI service definition later.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protocol_drift_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local dev connects via a Unix socket with peer/trust auth; this
      # service container is reachable only over TCP with a password, so
      # PROTOCOL_DRIFT_DSN overrides db.DEFAULT_DSN for this job only.
      PROTOCOL_DRIFT_DSN: postgresql://postgres:postgres@localhost:5432/protocol_drift_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set up database schema
        run: |
          psql "$PROTOCOL_DRIFT_DSN" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "$PROTOCOL_DRIFT_DSN" -f src/protocol_drift/db/schema.sql
          psql "$PROTOCOL_DRIFT_DSN" -f src/protocol_drift/trace/schema.sql

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest, including db-marked tests against the service container)
        run: pytest -m "not integration"
