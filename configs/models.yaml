# the digest is the actual reproducibility guarantee (sprint_plan.md appendix).
# Re-verify with `ollama list` / `ollama show <name>` before any full eval run --
# if the digest for a tag has changed, note it and decide whether to re-pin or
# pull the old digest explicitly.

