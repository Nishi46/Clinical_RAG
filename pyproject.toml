[project]
name = "protocol-drift"
version = "0.1.0"
description = "RAG + discrepancy detection over clinical trial protocols"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "types-requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live external services; excluded from default CI run",
]
